<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d140e">
<title>🍪 Cookie Clicker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<style>
:root{--bg:#1d140e;--panel:#2a1c13;--panel2:#3a281b;--line:#5a3e28;--txt:#f5e6d3;--dim:#b49a80;--gold:#ffd54a;--good:#7be37b;--bad:#ff6b6b;--cs:260px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background 2s}
body.g1{--bg:#2b130c}body.g2{--bg:#3a0d08}body.g3{--bg:#4d0606}
button{font:inherit;color:inherit;cursor:pointer;border:none}
.btn{background:linear-gradient(#6b4a2e,#4a3020);border:2px solid #8a6440;border-radius:8px;padding:6px 12px;font-weight:600;color:var(--txt)}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.gold{background:linear-gradient(#e0b030,#a07010);border-color:#ffd54a;color:#2a1a00}
.btn.red{background:linear-gradient(#a03030,#701818);border-color:#d05050}
#game{display:flex;height:100vh;height:100dvh}
/* LEFT */
#left{position:relative;width:34%;min-width:300px;overflow:hidden;display:flex;flex-direction:column;align-items:center;border-right:4px solid var(--line);background:radial-gradient(ellipse at 50% 55%,#4a3020 0%,var(--bg) 70%)}
body.g1 #left{background:radial-gradient(ellipse at 50% 55%,#5e2a16 0%,var(--bg) 70%)}
body.g2 #left,body.g3 #left{background:radial-gradient(ellipse at 50% 55%,#7a1010 0%,var(--bg) 70%)}
#head{z-index:5;text-align:center;padding:10px 8px 2px;width:100%;background:linear-gradient(rgba(0,0,0,.45),transparent)}
#bakery{font-size:14px;color:var(--dim);cursor:pointer}
#cookies{font-size:30px;font-weight:800;text-shadow:0 2px 6px #000;line-height:1.15}
#cookies small{font-size:18px;font-weight:600}
#cps,#cpc{font-size:14px;color:var(--dim)}
#cps b{color:var(--txt)}
#buffs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;z-index:5;min-height:4px;padding:2px 6px}
.buff{background:rgba(0,0,0,.55);border:1px solid var(--gold);border-radius:12px;padding:2px 8px;font-size:12px;font-weight:600}
.buff.badb{border-color:var(--bad)}
#cookieWrap{position:relative;flex:1;width:100%;min-height:0}
.ctr{position:absolute;left:50%;top:50%;width:0;height:0}
#shine{position:absolute;width:calc(var(--cs)*1.9);height:calc(var(--cs)*1.9);left:calc(var(--cs)*-.95);top:calc(var(--cs)*-.95);border-radius:50%;background:repeating-conic-gradient(rgba(255,220,150,.13) 0 10deg,transparent 10deg 30deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 40s linear infinite;pointer-events:none}
body.g2 #shine,body.g3 #shine{background:repeating-conic-gradient(rgba(255,60,40,.15) 0 10deg,transparent 10deg 30deg)}
#bigCookie{position:absolute;width:var(--cs);height:var(--cs);left:calc(var(--cs)/-2);top:calc(var(--cs)/-2);cursor:pointer;transition:transform .08s;z-index:3;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#bigCookie:hover{transform:scale(1.04)}#bigCookie.press{transform:scale(.94)}
#bigCookie svg,.gc svg{width:100%;height:100%;display:block}
#cursors{position:absolute;left:0;top:0;animation:spin 80s linear infinite;z-index:2;pointer-events:none}
#cursors span{position:absolute;left:-9px;top:-11px;font-size:17px;line-height:22px}
#wrinklers{position:absolute;left:0;top:0;z-index:4}
.wr{position:absolute;width:30px;height:64px;left:-15px;top:-32px;cursor:pointer}
.wr i{display:block;width:100%;height:100%;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:linear-gradient(#efe0d8,#a8847e);box-shadow:inset 0 -10px 10px rgba(90,0,0,.45),0 0 6px rgba(0,0,0,.6);animation:wob .5s ease-in-out infinite alternate}
.wr i::after{content:'';position:absolute;left:9px;bottom:3px;width:12px;height:8px;border-radius:50%;background:#400}
.wr i::before{content:'';position:absolute;left:7px;top:12px;width:16px;height:5px;border-top:3px dotted #400}
.wr.hit i{animation:shake .15s}
#milk{position:absolute;left:0;right:0;bottom:0;height:0;z-index:1;transition:height 1s,background 1s;pointer-events:none;opacity:.9}
#milk::before{content:'';position:absolute;left:0;right:0;top:-10px;height:12px;background:radial-gradient(circle at 10px -2px,transparent 10px,var(--mc) 11px) 0 0/20px 12px repeat-x;animation:wave 3s linear infinite}
#ver{position:fixed;left:6px;bottom:4px;font-size:11px;color:rgba(255,255,255,.55);z-index:6;pointer-events:none;text-shadow:0 1px 2px #000}
/* MID */
#mid{flex:1;display:flex;flex-direction:column;min-width:0;border-right:4px solid var(--line);background:var(--panel2)}
#ticker{background:#140d08;border-bottom:2px solid var(--line);padding:8px 12px;font-size:14px;font-style:italic;color:#e8d0b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:36px}
#news{display:inline-block;animation:fadein .6s}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--panel);border-bottom:2px solid var(--line)}
#tabs button{flex:1;min-width:max-content;padding:7px 10px;border-radius:8px;background:#4a3020;font-weight:600;font-size:13px;border:2px solid transparent}
#tabs button.on{border-color:var(--gold);background:#6b4a2e}
#tabs button.hl::after{content:' ●';color:var(--gold)}
#tab{flex:1;overflow-y:auto;padding:14px;min-height:0}
#tab h2{font-size:20px;margin:4px 0 10px}
#tab h3{font-size:16px;margin:16px 0 8px;color:var(--gold)}
.box{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14px}
.stat b{text-align:right}
.grid{display:flex;flex-wrap:wrap;gap:5px}
.ach{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#4a3020;border:2px solid #8a6440}
.ach.no{opacity:.3;filter:grayscale(1);background:#222;border-color:#444}
.small{font-size:12px;color:var(--dim)}
.bar{height:12px;background:#120b06;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9ad,#cef)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* RIGHT */
#right{width:350px;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.ptitle{padding:6px 10px;font-weight:800;font-size:15px;background:#140d08;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#research{font-size:12px;color:#9cf;font-weight:600}
#ups{display:flex;flex-wrap:wrap;gap:4px;padding:6px;max-height:30%;min-height:58px;overflow-y:auto;border-bottom:2px solid var(--line);align-content:flex-start}
#ups .empty{font-size:13px;color:var(--dim);padding:10px}
.up{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(#6b4a2e,#3a281b);border:2px solid var(--tc,#c8a060);cursor:pointer;position:relative}
.up.off{opacity:.42}
.up.res{--tc:#6cf}.up.spec{--tc:#f55}
.up:hover{filter:brightness(1.25)}
#bbar{display:flex;gap:4px;padding:6px;border-bottom:2px solid var(--line)}
#bbar button{flex:1;padding:6px 0;border-radius:6px;background:#4a3020;font-weight:700;font-size:13px;border:2px solid transparent}
#bbar button.on{border-color:var(--gold);background:#6b4a2e}
#bbar .sep{flex:.2}
#store{flex:1;overflow-y:auto;min-height:0}
.bld{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:2px solid #1d140e;cursor:pointer;background:linear-gradient(90deg,#4a3222,#3a281b)}
.bld:hover{filter:brightness(1.18)}
.bld .bi{font-size:32px;width:44px;text-align:center}
.bld .bt{flex:1;min-width:0}
.bld .bn{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bld .bp{font-size:13px;color:var(--good)}
.bld .bc{font-size:30px;font-weight:800;color:rgba(255,255,255,.35)}
.bld.off .bp{color:var(--bad)}
.bld.off{filter:brightness(.75)}
.bld.mys .bi,.bld.mys .bn{opacity:.5}
.bld.sell .bp{color:#ffb84a}
#mnav{display:none}
/* GOLDEN */
.gc{position:fixed;width:66px;height:66px;z-index:60;cursor:pointer;animation:gcp 1.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #ffd54a)}
.gc.wrath{filter:drop-shadow(0 0 14px #ff2020)}
.gc.storm{width:42px;height:42px;animation:fall 3s linear forwards}
.pop{position:fixed;z-index:70;pointer-events:none;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 4px #000,0 0 6px #000;animation:rise 1.4s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.big{font-size:22px;color:var(--gold)}
.crumb{position:fixed;z-index:2;pointer-events:none;font-size:14px;animation:crumb 1s ease-in forwards}
/* TOOLTIP / MODAL / TOAST */
#tip{position:fixed;z-index:100;display:none;max-width:320px;background:#120b06;border:2px solid #c8a060;border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.6);pointer-events:none}
#tip h4{font-size:15px;margin-bottom:4px}#tip h4 small{font-weight:400;color:var(--dim);font-size:12px}
#tip .pr{color:var(--good);font-weight:700;margin-bottom:4px}#tip .pr.no{color:var(--bad)}
#tip ul{margin:6px 0 0 16px}#tip p{margin:3px 0}
#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(420px,94vw)}
.toast{background:#120b06;border:2px solid var(--gold);border-radius:10px;padding:8px 14px;font-size:14px;box-shadow:0 4px 14px #000;animation:fadein .3s;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:120;display:none;align-items:center;justify-content:center;padding:14px}
#modal.show{display:flex}
#modal .mb{background:var(--panel);border:3px solid #c8a060;border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal textarea{width:100%;height:120px;background:#120b06;color:var(--txt);border:2px solid var(--line);border-radius:8px;padding:8px;font-family:monospace;font-size:12px;margin:10px 0;user-select:text;-webkit-user-select:text}
#modal .mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
/* HEAVEN */
#heaven{position:fixed;inset:0;z-index:110;display:none;flex-direction:column;background:radial-gradient(ellipse at center,#2b3b6b 0%,#0b0f22 75%)}
#heaven.show{display:flex}
#hhead{padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:rgba(0,0,0,.4);border-bottom:2px solid #8ab}
#hhead h2{font-size:20px}
#hscroll{flex:1;overflow:auto;position:relative}
#htree{position:relative;width:1200px;height:740px;margin:auto}
#htree svg{position:absolute;left:0;top:0}
#htree line{stroke:rgba(180,200,255,.25);stroke-width:4}
#htree line.on{stroke:#ffd54a}
.hn{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:#1b2448;border:3px solid #556;cursor:pointer}
.hn.own{background:#5a4a10;border-color:#ffd54a;box-shadow:0 0 16px #ffd54a}
.hn.can{border-color:#9cf;box-shadow:0 0 12px #6af;animation:gcp 1.6s infinite}
.hn.avail{border-color:#89a}
.hn.lock{opacity:.3;filter:grayscale(1)}
/* GARDEN / STOCK / SPELLS */
.seeds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seed{padding:6px 10px;border-radius:8px;background:#4a3020;border:2px solid transparent;font-size:13px}
.seed.on{border-color:var(--good)}
.plots{display:grid;gap:5px;max-width:340px}
.plot{aspect-ratio:1;border-radius:8px;background:#5a3a1e;border:2px solid #3a2410;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;position:relative;overflow:hidden}
.plot.ripe{box-shadow:inset 0 0 12px #af6;border-color:#8c4}
.plot em{position:absolute;left:0;bottom:0;height:4px;background:#8f4}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st td,table.st th{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
table.st .btn{padding:3px 7px;font-size:12px}
.spell{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:rgba(0,0,0,.2);margin-bottom:6px}
.spell .si{font-size:28px}.spell .sd{flex:1;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wob{from{transform:scaleY(1)}to{transform:scaleY(.9) scaleX(1.06)}}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes gcp{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.12) rotate(6deg)}}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
@keyframes crumb{from{opacity:1}to{opacity:0;transform:translate(var(--dx),120px) rotate(200deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes wave{to{background-position:20px 0}}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(140px)}}
/* MOBILE */
@media (max-width:900px){
 #game{flex-direction:column}
 #left{width:100%;min-width:0;height:44vh;height:44dvh;flex:none;border-right:none;border-bottom:3px solid var(--line);order:0}
 #mnav{display:flex;order:1;gap:4px;padding:5px;background:#140d08;border-bottom:2px solid var(--line)}
 #mnav button{flex:1;padding:8px;border-radius:8px;background:#4a3020;font-weight:700;border:2px solid transparent}
 #mnav button.on{border-color:var(--gold);background:#6b4a2e}
 #right{width:100%;flex:1;min-height:0;order:2}
 #mid{flex:1;min-height:0;order:3;border-right:none}
 body.mMid #right{display:none} body:not(.mMid) #mid{display:none}
 #cookies{font-size:24px}
 #toasts{top:auto;bottom:12px}
 #ups{max-height:25%}
 #tabs button{font-size:12px;padding:6px}
 .bld .bi{font-size:26px}
}
</style>
</head>
<body>
<div id="game">
 <div id="left">
  <div id="head">
   <div id="bakery" onclick="renameBakery()"></div>
   <div id="cookies">0 <small>Kekse</small></div>
   <div id="cps">pro Sekunde: <b>0</b></div>
   <div id="cpc"></div>
  </div>
  <div id="buffs"></div>
  <div id="cookieWrap">
   <div class="ctr"><div id="shine"></div><div id="cursors"></div><div id="bigCookie"></div><div id="wrinklers"></div></div>
  </div>
  <div id="milk"></div>
 </div>
 <div id="mnav"><button id="mShop" class="on" onclick="mobileTab(0)">🏪 Laden</button><button id="mMenu" onclick="mobileTab(1)">📋 Menü</button></div>
 <div id="mid">
  <div id="ticker"><span id="news">Willkommen in deiner Bäckerei! 🍪</span></div>
  <div id="tabs"></div>
  <div id="tab"></div>
 </div>
 <div id="right">
  <div class="ptitle"><span>✨ Upgrades</span><span id="research"></span></div>
  <div id="ups"></div>
  <div id="bbar">
   <button id="bm1" class="on" onclick="setBuy(1)">Kaufen</button><button id="bm0" onclick="setBuy(0)">Verkaufen</button><span class="sep"></span>
   <button id="ba1" class="on" onclick="setAmt(1)">1</button><button id="ba10" onclick="setAmt(10)">10</button><button id="ba100" onclick="setAmt(100)">100</button>
  </div>
  <div id="store"></div>
 </div>
</div>
<div id="ver"></div>
<div id="tip"></div>
<div id="toasts"></div>
<div id="modal"><div class="mb" id="mbody"></div></div>
<div id="heaven"><div id="hhead"></div><div id="hscroll"><div id="htree"></div></div></div>

<script>
'use strict';
const VERSION='v0.1.1 · Open Beta';
const KEY='tills-cookie-clicker-v1';
const $=id=>document.getElementById(id);
const now=()=>Date.now();
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ================= ZAHLEN ================= */
const SHORT=['','Tsd','Mio','Mrd','Bio','Brd','Trio','Trd','Qio','Qrd','Quio','Qurd','Sxio','Sxrd','Spio','Sprd','Okio','Okrd','Noio','Nord','Dzio','Dzrd'];
const LONG=['','Tausend','Millionen','Milliarden','Billionen','Billiarden','Trillionen','Trilliarden','Quadrillionen','Quadrilliarden','Quintillionen','Quintilliarden','Sextillionen','Sextilliarden','Septillionen','Septilliarden','Oktillionen','Oktilliarden','Nonillionen','Nonilliarden','Dezillionen','Dezilliarden'];
function fmt(n,dec=0,long=false){
 if(!isFinite(n))return '∞';
 if(n<0)return '-'+fmt(-n,dec,long);
 if(n<1e6){if(n>=1000||dec===0)n=Math.floor(n);return n.toLocaleString('de-DE',{maximumFractionDigits:n<1000?dec:0});}
 const e=Math.floor(Math.log10(n)/3);
 if(e>=SHORT.length)return n.toExponential(3).replace('.',',');
 const v=Math.floor(n/Math.pow(1000,e)*1000)/1000;
 return v.toLocaleString('de-DE',{maximumFractionDigits:3})+' '+(long?LONG[e]:SHORT[e]);
}
function fmtTime(s){s=Math.max(0,Math.floor(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,r=[];if(d)r.push(d+' T');if(h)r.push(h+' Std');if(m&&!d)r.push(m+' Min');if(!d&&!h)r.push(x+' s');return r.join(' ');}
function clock(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
const pct=x=>(x*100).toLocaleString('de-DE',{maximumFractionDigits:1})+' %';

/* ================= GEBÄUDE ================= */
const B=[
 ['Cursor','👆',15,0.1,'Klickt automatisch für dich.'],
 ['Oma','👵',100,1,'Eine nette Oma, die Kekse backt.'],
 ['Farm','🌾',1100,8,'Baut Kekspflanzen aus Keks-Samen an.'],
 ['Mine','⛏️',12000,47,'Baut Keksteig und Schokostückchen ab.'],
 ['Fabrik','🏭',130000,260,'Produziert riesige Mengen Kekse.'],
 ['Bank','🏦',1.4e6,1400,'Erzeugt Kekse aus Zinsen.'],
 ['Tempel','🛕',2e7,7800,'Voller kostbarer, uralter Schokolade.'],
 ['Zauberturm','🧙',3.3e8,44000,'Beschwört Kekse mit Magie.'],
 ['Raumfrachter','🚀',5.1e9,260000,'Bringt frische Kekse vom Keksplaneten.'],
 ['Alchemielabor','⚗️',7.5e10,1.6e6,'Verwandelt Gold in Kekse!'],
 ['Portal','🌀',1e12,1e7,'Öffnet ein Tor ins Keksversum.'],
 ['Zeitmaschine','⏳',1.4e13,6.5e7,'Holt Kekse aus der Vergangenheit, bevor sie gegessen wurden.'],
 ['Antimaterie-Kondensator','⚛️',1.7e14,4.3e8,'Verdichtet Antimaterie zu Keksen.'],
 ['Prisma','🌈',2.1e15,2.9e9,'Verwandelt Licht in Kekse.'],
 ['Glücksmaschine','🍀',2.6e16,2.1e10,'Erzeugt Kekse aus purem Glück.'],
 ['Fraktal-Maschine','🔷',3.1e17,1.5e11,'Macht aus Keksen noch mehr Kekse – unendlich.']
].map((a,i)=>({i,name:a[0],icon:a[1],price:a[2],cps:a[3],desc:a[4]}));

/* ================= UPGRADES ================= */
const U=[],UP={};
function addU(o){U.push(o);UP[o.id]=o;}
const TIER_N=[1,5,25,50,100,150,200,250,300,350,400];
const TIER_P=[10,50,500,5e4,5e6,5e8,5e10,5e13,5e16,5e19,5e22];

function newState(){return{

 b:B.map(()=>0),lv:B.map(()=>0),up:{},ach:{},hv:{},
 prestige:0,chips:0,asc:0,ascending:false,
 start:now(),runStart:now(),played:0,last:now(),
 gcNext:0,pledgeEnd:0,pledges:0,resT:0,wr:[],buffs:[],
 lumps:0,lumpsTotal:0,lumpT:0,drag:0,aura:-1,
 garden:{seed:0,p:[]},stock:null,mana:0,casts:0,harvests:0,stockWin:0,
 sold:0,maxChain:0,particles:true,tab:0
}}
let S=newState();
let C={raw:0,gm:1,cpsB:0,cps:0,click:1,each:B.map(()=>0)};
const has=id=>!!S.up[id];
const hh=id=>!!S.hv[id];
const totalB=()=>S.b.reduce((a,b)=>a+b,0);
const upCount=()=>Object.keys(S.up).length;
const achCount=()=>Object.keys(S.ach).length;
const milk=()=>achCount()*0.04;
function rawStage(){return has('r9')?3:has('r7')?2:has('r5')?1:0;}
function stage(){if(has('cov')||S.pledgeEnd>now())return 0;return rawStage();}

/* ================= BERECHNUNG ================= */
function tiers(i){let n=0;const L=i===0?3:TIER_N.length;for(let t=0;t<L;t++)if(S.up['b'+i+'t'+t])n++;return n;}
function fingerAdd(){
 if(!has('f0'))return 0;
 let m=1;for(let k=1;k<FING.length;k++)if(has('f'+k))m*=FING[k][3];
 return 0.1*(totalB()-S.b[0])*m;
}
function unitCps(i){
 const n=S.b[i];let base=B[i].cps,m=1;
 if(i===0)base=base*Math.pow(2,tiers(0))+fingerAdd();
 else m*=Math.pow(2,tiers(i));
 if(i===1){
  if(has('r0'))m*=4;if(has('r3'))m*=2;
  if(has('r5'))base+=0.02*n;if(has('r7'))base+=0.02*n;if(has('r9'))base+=0.05*n;
  for(let j=2;j<B.length;j++)if(has('g'+j))m*=1+0.01*S.b[j]/(j-1);
  if(S.aura===3)m*=1+0.01*(totalB()-n);
 }else if(i>=2&&has('g'+i))m*=2;
 m*=1+0.01*S.lv[i];
 return base*m;
}
function globalMult(){
 let m=1+0.01*S.prestige;
 if(hh('hc1'))m*=1.1;if(hh('hc2'))m*=1.25;
 for(const u of COOKIE_UPS)if(S.up[u.id])m*=1+u.pct/100;
 RES_PCT.forEach((p,k)=>{if(p&&has('r'+k))m*=1+p/100;});
 const mk=milk()*(1+(hh('kat')?0.1:0)+(S.aura===2?0.05:0));
 KIT.forEach((k,j)=>{if(has('m'+j))m*=1+mk*k[3];});
 if(has('cov'))m*=0.95;
 m*=1+0.01*gardenCount(0);
 if(S.aura===5)m*=2;
 return m;
}
function buffMult(){let m=1,cm=1;for(const b of S.buffs){if(b.m)m*=b.m;if(b.cm)cm*=b.cm;}return[m,cm];}
function calc(){
 let raw=0;const each=[];
 for(let i=0;i<B.length;i++){const u=unitCps(i);each.push(u);raw+=u*S.b[i];}
 const gm=globalMult();raw*=gm;
 const[bm,cm]=buffMult();
 const cpsB=raw*bm;
 const cps=cpsB*(1-0.05*S.wr.length);
 let click=Math.pow(2,tiers(0))+fingerAdd();
 let cp=0;for(let k=0;k<MICE.length;k++)if(has('c'+k))cp+=0.01;
 click+=cp*cpsB;
 click*=cm*(S.aura===0?1.05:1)*(1+0.02*gardenCount(1));
 C={raw,gm,cpsB,cps,click,each};
 return C;
}
function earn(x){if(!(x>0))return;S.cookies+=x;S.earned+=x;}

/* ================= KAUFEN ================= */
let buyMode=1,buyAmt=1;
function bCost(i,amt){return B[i].price*Math.pow(1.15,S.b[i])*(Math.pow(1.15,amt)-1)/0.15;}
function bRefund(i,amt){amt=Math.min(amt,S.b[i]);if(amt<=0)return 0;return 0.25*B[i].price*Math.pow(1.15,S.b[i]-amt)*(Math.pow(1.15,amt)-1)/0.15;}
function storeClick(i){
 if(!bShown(i))return;
 if(buyMode){const c=bCost(i,buyAmt);if(S.cookies<c)return;S.cookies-=c;S.b[i]+=buyAmt;}
 else{const n=Math.min(buyAmt,S.b[i]);if(!n)return;S.cookies+=bRefund(i,n);S.b[i]-=n;S.sold+=n;}
 calc();updateStore();renderCursors();
}

function pickEffect(wrath){

 earn(v);chain.total+=v;chain.steps++;chain.d++;S.maxChain=Math.max(S.maxChain,chain.steps);

 if(t==='wr'){const w=S.wr[+a];if(!w)return'';return`<h4>🐛 Runzler</h4><p>Hat <b>${fmt(w.e)}</b> Kekse gefressen.</p><p>Platzen lassen gibt <b>${fmt(w.e*(hh('wrk')?1.2:1.1))}</b> zurück. (${w.hp}× klicken)</p>`;}

 if(t==='seed'){const s=SEEDS[+a];return`<h4>${s.i} ${s.n}</h4><p>${s.d}</p><p class="small">Wächst in ${s.grow} Min · kostet ${s.cost} Min KpS</p>`;}
 if(t==='plot'){const p=S.garden.p[+a];if(!p)return`<h4>Leeres Feld</h4><p>Antippen: ${SEEDS[S.garden.seed].i} ${SEEDS[S.garden.seed].n} pflanzen</p>`;const s=SEEDS[p.s];return ripe(p)?`<h4>${s.i} ${s.n} – reif!</h4><p>${s.d}</p><p class="small">Antippen zum Ernten</p>`:`<h4>🌱 ${s.n}</h4><p>Reif in ${clock((s.grow*60000-(now()-p.t))/1000)}</p>`;}
 return'';

function showTip(){
 const html=tipHTML(tipKey);if(!html){hideTip();return;}
 const tip=$('tip');tip.innerHTML=html;tip.style.display='block';
 const r=tipEl.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
 let x,y;
 if(r.left-tw-10>=4){x=r.left-tw-10;y=r.top;}
 else if(r.right+tw+10<=innerWidth-4){x=r.right+10;y=r.top;}
 else{x=Math.max(4,Math.min(innerWidth-tw-4,r.left+r.width/2-tw/2));y=r.top-th-8;if(y<4)y=r.bottom+8;}
 y=Math.max(4,Math.min(innerHeight-th-4,y));
 tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tipEl=null;tipKey=null;$('tip').style.display='none';}
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tipEl=t;tipKey=t.dataset.tip;showTip();}else if(!tipTouchTimer)hideTip();});
document.addEventListener('touchstart',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tipEl=t;tipKey=t.dataset.tip;showTip();clearTimeout(tipTouchTimer);tipTouchTimer=setTimeout(()=>{tipTouchTimer=0;hideTip();},2500);}},{passive:true});

 $('modal').classList.add('show');
 $('mbody').querySelectorAll('.mbtns button').forEach(el=>el.onclick=()=>{const b=btns[+el.dataset.i];const keep=b.f&&b.f()===false;if(!keep)$('modal').classList.remove('show');});
}
function toast(txt){const d=document.createElement('div');d.className='toast';d.innerHTML=txt;$('toasts').appendChild(d);setTimeout(()=>d.remove(),4200);while($('toasts').childElementCount>4)$('toasts').firstChild.remove();}

/* ================= SPEICHERN ================= */
function save(manual){S.last=now();try{localStorage.setItem(KEY,JSON.stringify(S));if(manual)toast('💾 Gespeichert!');}catch(e){if(manual)toast('⚠️ Speichern fehlgeschlagen');}}
function fixState(d){
 const s=Object.assign(newState(),d);
 const fixArr=(a,len)=>{a=Array.isArray(a)?a.slice(0,len):[];while(a.length<len)a.push(0);return a.map(x=>+x||0);};
 s.b=fixArr(s.b,B.length);s.lv=fixArr(s.lv,B.length);
 if(!s.garden||!Array.isArray(s.garden.p))s.garden={seed:0,p:[]};
 if(!Array.isArray(s.wr))s.wr=[];if(!Array.isArray(s.buffs))s.buffs=[];
 return s;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)S=fixState(JSON.parse(raw));}catch(e){console.warn(e);}}
function exportSave(){
 save();const txt=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 modal(`<h2>📤 Spielstand exportieren</h2><p class="small">Kopiere den Text und bewahre ihn gut auf.</p><textarea id="exp" readonly>${txt}</textarea>`,[{t:'📋 Kopieren',f:()=>{const ta=$('exp');ta.select();try{navigator.clipboard.writeText(ta.value);toast('📋 Kopiert!');}catch(e){document.execCommand('copy');}return false;}},{t:'Schließen'}]);
}
function importSave(){
 modal(`<h2>📥 Spielstand importieren</h2><p class="small">Füge deinen exportierten Text ein. Dein aktueller Spielstand wird ersetzt!</p><textarea id="imp" placeholder="Spielstand hier einfügen …"></textarea>`,[{t:'Abbrechen'},{t:'Importieren',c:'gold',f:()=>{
  try{const d=JSON.parse(decodeURIComponent(escape(atob($('imp').value.trim()))));if(!d||!Array.isArray(d.b))throw 0;S=fixState(d);S.last=now();lastTick=now();wrKey='';$('cursors').innerHTML='';golds.slice().forEach(removeGold);scheduleGC();calc();save();renderAll();toast('✅ Spielstand geladen!');}
  catch(e){toast('⚠️ Ungültiger Spielstand');return false;}
 }}]);
}
function hardReset(){
 modal('<h2>🗑️ Wirklich alles löschen?</h2><p style="margin-top:8px">Das kann nicht rückgängig gemacht werden!</p>',[{t:'Abbrechen'},{t:'Ja, löschen',c:'red',f:()=>{localStorage.removeItem(KEY);S=newState();wrKey='';$('cursors').innerHTML='';golds.slice().forEach(removeGold);chain=null;scheduleGC();calc();renderAll();$('heaven').classList.remove('show');toast('Neuer Anfang 🍪');}}]);
}


/* ================= CHEAT-MENÜ ================= */
let cheatOK=false;
function cheatLogin(){
 if(cheatOK){cheatMenu();return;}
 modal(`<h2>🔐 Cheat-Menü</h2><p class="small" style="margin:6px 0">Code eingeben:</p><input id="ccode" type="password" autocomplete="off" style="width:100%;padding:8px;border-radius:8px;border:2px solid var(--line);background:#120b06;color:var(--txt);font-size:16px">`,[{t:'Abbrechen'},{t:'Öffnen',c:'gold',f:()=>{if($('ccode').value.trim()==='4uT2-U6G3'){cheatOK=true;setTimeout(cheatMenu,0);}else{toast('❌ Falscher Code');return false;}}}]);
 setTimeout(()=>{const i=$('ccode');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')$('mbody').querySelector('.btn.gold').click();};}},50);
}
const CHEATS=[
 ['🍪 Kekse',[['+1 Mio',()=>earn(1e6)],['+1 Mrd',()=>earn(1e9)],['+1 Bio',()=>earn(1e12)],['+1 Brd',()=>earn(1e15)],['Kekse ×10',()=>earn(Math.max(S.cookies*9,10))],['Kekse auf 0',()=>{S.cookies=0;}]]],
 ['🏗️ Gebäude',[['+10 von allen',()=>{S.b=S.b.map(n=>n+10);}],['+100 von allen',()=>{S.b=S.b.map(n=>n+100);}],['Alle Gebäude auf 0',()=>{S.b=B.map(()=>0);}]]],
 ['✨ Upgrades & Erfolge',[['Verfügbare Upgrades gratis',()=>{let n=0;for(let k=0;k<20;k++){const l=availUps().filter(u=>!u.repeat);if(!l.length)break;l.forEach(u=>{S.up[u.id]=1;n++;if(u.kind==='res')S.resT=0;});calc();}toast(`✨ ${n} Upgrades freigeschaltet`);}],['Alle Erfolge',()=>{A.forEach(a=>S.ach[a.id]=1);renderMilk();}],['Erfolge zurücksetzen',()=>{S.ach={};renderMilk();}]]],
 ['🌟 Goldkekse & Effekte',[['Goldkeks',()=>spawnGolden('gold')],['Zornkeks',()=>spawnGolden('wrath')],['Frenzy',()=>addBuff('frenzy','Frenzy',77,7,1,0,'🔥')],['Click Frenzy',()=>addBuff('cfrenzy','Click Frenzy',13,1,777,0,'👆')],['Elder Frenzy',()=>addBuff('efrenzy','Elder Frenzy',6,666,1,0,'😈')],['Cookie Storm',()=>{stormEnd=now()+7000;addBuff('storm','Cookie Storm',7,1,1,0,'🌧️');}],['Effekte beenden',()=>{S.buffs=[];}]]],
 ['👵 Oma-Apokalypse',[['Apokalypse starten',()=>{for(let k=0;k<10;k++)S.up['r'+k]=1;delete S.up.cov;S.pledgeEnd=0;}],['Runzler spawnen',()=>{if(S.wr.length<10)S.wr.push({a:Math.random()*360,e:C.cpsB*60,hp:3});}],['Apokalypse beenden',()=>{['r5','r7','r9'].forEach(k=>delete S.up[k]);popAll();}]]],
 ['♻️ Prestige & Extras',[['+100 Himmelschips',()=>{S.chips+=100;}],['+10 Prestige-Level',()=>{S.prestige+=10;}],['+10 Zuckerwürfel',()=>{S.lumps+=10;S.lumpsTotal+=10;}],['Alle Gebäude Stufe +1',()=>{S.lv=S.lv.map(l=>l+1);}],['Drache freischalten',()=>{S.hv.drg=1;}],['Drache ausgewachsen',()=>{S.hv.drg=1;S.drag=18;}],['Mana auffüllen',()=>{S.mana=manaMax();}],['Pflanzen sofort reif',()=>{S.garden.p.forEach(p=>{if(p)p.t=0;});}]]],
 ['⏩ Zeit',[['+1 Stunde KpS',()=>earn(C.raw*3600)],['+1 Tag KpS',()=>earn(C.raw*86400)],['Forschung sofort',()=>{S.resT=0;}],['Goldkeks-Timer sofort',()=>{S.gcNext=now();}]]]
];
function cheatDo(g,k){CHEATS[g][1][k][1]();calc();renderAll();toast('🛠️ '+CHEATS[g][1][k][0]);}
function cheatMenu(){
 modal(`<h2>🛠️ Cheat-Menü</h2><p class="small" style="margin-bottom:8px">Nur für Tests – macht das Spiel schnell langweilig 😉</p>${CHEATS.map((g,gi)=>`<h3 style="margin:12px 0 6px;color:var(--gold);font-size:15px">${g[0]}</h3><div class="row">${g[1].map((c,ci)=>`<button class="btn" style="padding:5px 9px;font-size:13px" onclick="cheatDo(${gi},${ci})">${c[0]}</button>`).join('')}</div>`).join('')}`,[{t:'Schließen'}]);
}

 const L=['Keks-Preise steigen weltweit.','Lokale Oma backt besten Keks des Jahres.','Studie: Kekse machen glücklich. Wissenschaftler wenig überrascht.','Mann verwechselt Keks mit Untersetzer – Kaffee verschüttet.','Eilmeldung: Der Keks ist immer noch rund.','Influencer isst 50 Kekse live – Chat rastet aus.','Ernährungsexperten warnen: zu wenig Kekse ist auch keine Lösung.','Umfrage: 9 von 10 Menschen mögen Kekse. Der zehnte lügt.'];
 const st=stage(),b=S.b;
 if(S.earned<5)L.push('Du hast das Gefühl, du solltest Kekse backen. Aber niemand will deine Kekse.','Deine ersten Kekse schmecken … okay.');
 if(b[1])L.push('Omas schwören: „Mit Liebe gebacken.“');
 if(b[2])L.push('Bauern melden Rekordernte bei Keks-Weizen.');
 if(b[3])L.push('Bergleute stoßen auf riesige Schokoader.');
 if(b[4])L.push('Neue Keksfabrik eröffnet – Anwohner riechen nur noch Vanille.');
 if(b[5])L.push('Banken akzeptieren ab sofort Kekse als Währung.');
 if(b[6])L.push('Mönche verehren den Großen Keks.');
 if(b[7])L.push('Zauberer verwandelt Kritiker in Kekskrümel.');
 if(b[8])L.push('Raumfrachter landet mit frischen Keksen vom Keksplaneten.');
 if(b[9])L.push('Alchemisten: „Gold? Langweilig. Kekse!“');
 if(b[10])L.push('Kekse aus dem Portal schmecken nach Zimt und Chaos.');
 if(b[11])L.push('Zeitreisende bringen Kekse aus dem Jahr 3000 – zu knusprig.');
 if(b[12])L.push('Physiker: Antimaterie-Kekse schmecken nach nichts – und nach allem.');
 if(b[13])L.push('Regenbögen gibt es jetzt mit Keksgeschmack.');
 if(b[14])L.push('Glücksmaschine zieht dreimal hintereinander die 7.');
 if(b[15])L.push('Mathematiker finden einen Keks in einem Keks in einem Keks …');
 if(S.earned>1e6)L.push(`Die Bäckerei ${S.name==='Deine'?'':'von '+S.name+' '}ist berühmt: ${fmt(S.earned,0,true)} Kekse gebacken!`);
 if(st>=1)L.push('Omas sind unruhig. Sie stricken schneller als je zuvor.','Nachbarn berichten von seltsamem Murmeln aus der Bäckerei.');

 if(st>=3)L=[...L,'ER IST ERWACHT.','DIE OMAS SIND EINS.','Es gibt kein Entkommen vor den Omas.'];

/* ================= ERFOLGE CHECK ================= */
function checkAch(){
 let n=0;
 for(const a of A){if(!S.ach[a.id]&&a.check()){S.ach[a.id]=1;n++;if(n<=3)toast(`🏆 Erfolg: <b>${a.name}</b>`);}}
 if(n){calc();renderMilk();if(S.tab===1)renderTab();}
}

/* ================= LOOP ================= */
let lastTick=now(),slowAcc=0,secAcc=0,saveAcc=0,newsAcc=0;
function tick(){
 const t=now();let dt=(t-lastTick)/1000;lastTick=t;
 if(dt<=0)return;
 if(dt>60){offline(dt);dt=0;}
 S.played+=dt;
 const before=S.buffs.length;S.buffs=S.buffs.filter(b=>b.end>t);if(S.buffs.length!==before)calc();
 calc();
 if(!S.ascending){
  earn(C.cps*dt);
  for(const w of S.wr)w.e+=C.cpsB*0.05*dt;
  if(S.gcNext&&t>=S.gcNext&&!golds.some(g=>!g.storm)&&!chain){S.gcNext=t+1e10;spawnGolden();}
  if(t<stormEnd&&Math.random()<dt*4)spawnStorm();
  const st=stage();
  if(st>0&&S.wr.length<10&&Math.random()<dt*0.002*st){S.wr.push({a:Math.random()*360,e:0,hp:3});}
  if(st===0&&S.wr.length&&(has('cov')||S.pledgeEnd>t))popAll();
  if(S.lv[7]>=1)S.mana=Math.min(manaMax(),S.mana+manaMax()/300*dt);
 }
 updateGolds();
 updateHead();
 slowAcc+=dt;secAcc+=dt;saveAcc+=dt;newsAcc+=dt;
 if(slowAcc>=0.25){slowAcc=0;
  updateStore();renderUps();renderBuffs();renderWrinklers();renderCursors();
  document.body.className=document.body.className.replace(/\bg\d\b/g,'').trim()+' g'+stage();
  if(tipEl){if(!document.body.contains(tipEl)){const n=document.querySelector(`[data-tip="${tipKey}"]`);if(n&&(n.matches(':hover')||tipTouchTimer)){tipEl=n;showTip();}else hideTip();}else showTip();}
 }
 if(secAcc>=1){secAcc=0;
  checkAch();
  if(lumpsOn()){if(!S.lumpT)S.lumpT=t;let n=0;const mt=lumpMature();while(t-S.lumpT>=mt){S.lumps++;S.lumpsTotal++;S.lumpT+=mt;n++;}if(n)toast(`🧊 ${n} Zuckerwürfel gereift!`);}
  if(S.lv[5]>=1){stockInit();let n=0;while(t-S.stock.t>=60000&&n<60){S.stock.t+=60000;stockTick();n++;}if(n>=60)S.stock.t=t;}
  if([0,3,4].includes(S.tab)||(S.tab===2))renderTab();
  if(S.tab===1&&achShown!==achCount())renderTab();
  renderTabs();
 }
 if(saveAcc>=30){saveAcc=0;save();}
 if(newsAcc>=9){newsAcc=0;news();}
}
function offline(sec){
 calc();const p=offlinePct();
 if(S.lv[7]>=1)S.mana=Math.min(manaMax(),S.mana+manaMax()/300*sec);
 if(p>0&&C.raw>0&&!S.ascending){const g=C.raw*p*sec;earn(g);
  modal(`<h2>👋 Willkommen zurück!</h2><p style="margin-top:8px">Du warst <b>${fmtTime(sec)}</b> weg. Deine Bäckerei hat in der Zeit <b>${fmt(g,0,true)}</b> Kekse gebacken (${pct(p)} der KpS). 🍪</p>`,[{t:'Super!',c:'gold'}]);}
 else if(sec>300&&C.raw>0&&!S.ascending)toast(`👋 Willkommen zurück! Tipp: Mit Himmels-Upgrades backst du auch offline.`);
}

/* ================= SETUP ================= */
function sizeCookie(){const w=$('cookieWrap');const cs=Math.max(120,Math.min(300,w.clientWidth*0.62,w.clientHeight*0.72));document.documentElement.style.setProperty('--cs',cs+'px');wrKey='';$('cursors').innerHTML='';renderWrinklers();renderCursors();}
function mobileTab(i){document.body.classList.toggle('mMid',i===1);$('mShop').classList.toggle('on',i===0);$('mMenu').classList.toggle('on',i===1);}
function renderAll(){renderBakery();updateStore();renderUps(true);renderTabs();renderTab();renderMilk();renderBuffs();wrKey='';renderWrinklers();renderCursors();updateHead();}
function init(){
 load();
 $('ver').textContent=VERSION;
 $('bigCookie').innerHTML=BIG_SVG;
 $('bigCookie').addEventListener('pointerdown',e=>{e.preventDefault();clickCookie(e);});
 initStore();
 calc();
 const away=(now()-(S.last||now()))/1000;
 if(!S.gcNext||S.gcNext>now()+3600000)scheduleGC();
 lastTick=now();
 sizeCookie();renderAll();
 if(away>60)offline(away);
 if(S.ascending)showHeaven(false);
 news();
 setInterval(tick,33);
 addEventListener('resize',sizeCookie);
 addEventListener('beforeunload',()=>save());
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
 document.addEventListener('contextmenu',e=>{if(e.target.closest('#bigCookie,.gc,.wr'))e.preventDefault();});
}
init();
</script>
